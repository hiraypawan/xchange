<!DOCTYPE html>
<html>
<head>
    <title>Fix User Credits</title>
</head>
<body>
    <h1>Fix User Credits</h1>
    <button onclick="fixUserCredits()">Fix My Credits (POST)</button>
    <button onclick="checkStatus()">Check Status (GET)</button>
    <div id="result"></div>

    <script>
        async function fixUserCredits() {
            document.getElementById('result').innerHTML = 'Fixing credits...';
            try {
                const response = await fetch('/api/fix-user-credits', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }

        async function checkStatus() {
            document.getElementById('result').innerHTML = 'Checking status...';
            try {
                const response = await fetch('/api/fix-user-credits', {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
